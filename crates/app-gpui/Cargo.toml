[package]
name = "app-gpui"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The app with a native UI (GPUI and gpui-component) instead of the webview.
# The product's exe (tools/bundle.ps1 ships it as backseat.exe).
[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
backseat-core = { path = "../backseat-core" }
media.workspace = true
gpui-kit = "=0.9.1"
raw-window-handle = "0.6"
serde_json = "1"
base64 = "0.22"
tray-icon = "0.25"
image = { version = "0.25", default-features = false, features = ["png"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security_Cryptography", "Win32_Globalization"] }

[build-dependencies]
tauri-winres = "0.3"
