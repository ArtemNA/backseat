<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Backseat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Join -->
  <div id="join" class="join">
    <form id="join-form">
      <h1 data-t="connect.title"></h1>
      <label class="field"><span data-t="connect.server"></span><input id="f-server" value="ws://127.0.0.1:7800/ws" required></label>
      <label class="field"><span data-t="connect.name"></span><input id="f-name" required maxlength="32"></label>
      <div id="join-mode" class="seg" style="align-self:stretch"></div>
      <label class="field" id="row-title"><span data-t="join.room_title"></span><input id="f-title" maxlength="48"></label>
      <label class="field hidden" id="row-code"><span data-t="join.code"></span><input id="f-code" placeholder="K7Q2-9XMB-4TQ1" autocomplete="off"></label>
      <label class="field"><span data-t="connect.language"></span><select id="f-lang"></select></label>
      <div id="join-error" class="banner error hidden"></div>
      <button id="join-submit" class="btn primary" type="submit"></button>
      <button id="join-back" class="btn hidden" type="button" data-t="join.back"></button>
      <button id="join-settings" class="btn ghost" type="button" data-t="set.open"></button>
    </form>
  </div>

  <!-- Room -->
  <div id="shell" class="shell hidden">
    <nav id="rail" class="rail" aria-label="Rooms"></nav>
    <div id="room-menu" class="menu hidden" role="menu"></div>
    <aside class="side">
      <header><span id="room-name" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <button id="invite" class="icon-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M19 8v6M22 11h-6"></path></svg>
        </button>
        <button id="leave" class="icon-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg>
        </button>
      </header>
      <div id="people" class="people"></div>
      <div id="toast" class="toast hidden" role="status"></div>
      <div class="me">
        <span id="me-avatar" class="avatar"></span>
        <span class="who"><span data-t="room.you"></span><span id="me-state" class="small"></span></span>
        <button id="settings-btn" class="icon-btn" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </button>
        <button id="go-live" class="btn primary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="12" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
          <span data-t="room.go_live"></span>
        </button>
      </div>
    </aside>
    <main class="main">
      <header id="main-header"></header>
      <div id="stage" class="stage hidden"></div>
      <div id="content" class="scroll below"></div>
    </main>
  </div>

  <!-- Change my name in a saved room -->
  <dialog id="rename" class="small-dlg">
    <form method="dialog" style="padding:20px 24px;display:flex;flex-direction:column;gap:12px">
      <b id="rename-title"></b>
      <input id="rename-name" maxlength="32" required>
      <div class="controls" style="justify-content:flex-end">
        <button class="btn" value="cancel" type="submit" formnovalidate data-t="common.cancel"></button>
        <button id="rename-save" class="btn primary" value="save" type="submit" data-t="common.save"></button>
      </div>
    </form>
  </dialog>

  <!-- Settings -->
  <dialog id="settings">
    <form class="dlg" method="dialog">
      <header><h2 data-t="set.title"></h2></header>
      <div class="body set-body">
        <nav class="set-tabs">
          <button type="button" data-tab="general" data-t="set.general"></button>
          <button type="button" data-tab="updates" data-t="set.updates"></button>
        </nav>
        <section id="set-general" class="set-page">
          <label class="field" id="set-server-row"><span data-t="set.server"></span><input id="set-server" placeholder="wss://example.com/ws" autocomplete="off"></label>
          <span class="small" id="set-server-hint" data-t="set.server_hint"></span>
          <label class="field"><span data-t="connect.language"></span><select id="set-lang"></select></label>
          <label class="opt"><input type="checkbox" id="set-tray"> <span data-t="set.tray"></span></label>
        </section>
        <section id="set-updates" class="set-page hidden">
          <b id="set-version" style="color:var(--bright)"></b>
          <label class="opt"><input type="checkbox" id="set-auto"> <span data-t="set.auto_update"></span></label>
          <div class="row" style="gap:10px;align-items:center">
            <button type="button" class="btn" id="set-check" data-t="set.check"></button>
            <button type="button" class="btn primary hidden" id="set-install" data-t="set.install"></button>
          </div>
          <div id="set-status" class="small"></div>
        </section>
      </div>
      <footer><button class="btn primary" value="close" type="submit" data-t="set.close"></button></footer>
    </form>
  </dialog>

  <!-- Go live -->
  <dialog id="golive">
    <form class="dlg" method="dialog" id="golive-form">
      <header><h2 data-t="golive.title"></h2><div id="gl-sub" class="small"></div></header>
      <div class="body">
        <div class="seg" role="group">
          <button type="button" id="gl-tab-screen" data-t="golive.screen"></button>
          <button type="button" id="gl-tab-window" data-t="golive.window"></button>
        </div>
        <div id="gl-sources" class="sources"></div>
        <div>
          <div class="legend" data-t="golive.audio"></div>
          <div class="row" style="margin-top:8px">
            <label class="opt"><input type="radio" name="audio" value="system" checked> <span data-t="golive.audio_system"></span></label>
            <label class="opt" id="gl-audio-app"><input type="radio" name="audio" value="app"> <span data-t="golive.audio_app"></span></label>
            <label class="opt"><input type="radio" name="audio" value="none"> <span data-t="golive.audio_none"></span></label>
          </div>
        </div>
        <div>
          <div class="legend" data-t="golive.quality"></div>
          <div class="row" style="margin-top:8px">
            <div class="controls"><label><span data-t="golive.resolution"></span><span id="gl-res" class="seg"></span></label></div>
            <div class="controls"><label><span data-t="golive.fps"></span><span id="gl-fps" class="seg"></span></label></div>
            <div class="controls"><label><span data-t="golive.bitrate"></span><span id="gl-kbit" class="seg"></span></label></div>
            <div class="controls"><label><span data-t="golive.codec"></span><span id="gl-codec" class="seg"></span></label></div>
          </div>
          <div id="gl-codec-note" class="small" style="margin-top:6px"></div>
        </div>
        <div class="box">
          <div style="display:flex;justify-content:space-between"><span id="gl-upload-label" class="small"></span><b id="gl-upload" style="color:var(--bright)"></b></div>
          <div class="meter"><div id="gl-upload-bar" style="width:0%"></div></div>
          <span id="gl-upload-note" class="small"></span>
          <label class="field" style="margin-top:6px"><span data-t="up.limit"></span><input id="gl-limit" type="number" min="1" max="10000" step="1" inputmode="numeric" style="max-width:160px"></label>
          <span class="small" data-t="up.limit_hint"></span>
          <div id="gl-over" class="banner hidden"></div>
        </div>
        <div id="gl-error" class="banner error hidden"></div>
      </div>
      <footer>
        <button type="button" class="btn ghost" id="gl-cancel" data-t="golive.cancel"></button>
        <button type="button" class="btn primary" id="gl-start" data-t="golive.start"></button>
      </footer>
    </form>
  </dialog>

  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
