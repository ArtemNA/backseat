[package]
name = "app-webview"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The former webview UI, kept to check that both read the same state file.
[[bin]]
name = "app-webview"
path = "src/main.rs"

[dependencies]
backseat-core = { path = "../backseat-core" }
media.workspace = true
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
