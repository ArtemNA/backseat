[package]
name = "probes"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.25" }
gst-sdp = { package = "gstreamer-sdp", version = "0.25" }
gst-rtp = { package = "gstreamer-rtp", version = "0.25" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
pkg-config = "0.3"
