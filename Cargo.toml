[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/media", "crates/host", "crates/viewer", "crates/nat", "crates/backseat-core", "crates/app", "crates/app-gpui"]
exclude = ["probes"]

[workspace.package]
version = "0.2.9"
edition = "2021"
publish = false

[workspace.dependencies]
gst = { package = "gstreamer", version = "0.25" }
gst-app = { package = "gstreamer-app", version = "0.25" }
gst-webrtc = { package = "gstreamer-webrtc", version = "0.25", features = ["v1_18"] }
gst-sdp = { package = "gstreamer-sdp", version = "0.25" }
gst-rtp = { package = "gstreamer-rtp", version = "0.25" }
media = { path = "crates/media" }
